name: Update fund data

on:
  schedule:
    - cron: '40 22 * * 1,3,5'   # Mon, Wed, Fri after the US market close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh fund data
        run: python3 scripts/update_funds.py
      - name: Rebuild fund pages
        run: python3 scripts/build_pages.py
      - name: Commit
        run: |
          git config user.name "benjiesiegel1414"
          git config user.email "benjiesbusiness@gmail.com"
          git add -A data sitemap.xml '*.html'
          git diff --cached --quiet || git commit -m "Update fund data"
          git push
